<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7f340b" />
    <title>Offline | Local Fibre</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        box-sizing: border-box;
        background: #f9f2e6;
        color: #411f0a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 20px;
      }
      h1 {
        color: #7f340b;
        font-size: 1.5rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.6;
      }
      button {
        font: inherit;
        font-weight: 500;
        padding: 0.75rem 1.75rem;
        min-height: 44px;
        border: none;
        border-radius: 12px;
        background: #7f340b;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Local Fibre" />
      <h1>You&rsquo;re offline</h1>
      <p>Check your internet connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
